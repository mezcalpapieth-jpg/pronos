<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gráfica de mercado | Pronos</title>
  <style>
    html, body { margin: 0; background: #111; color: #f5f5f3; }
    vunelix-advanced-chart { display: block; height: 100dvh; }
    .pronos-replay-controls {
      display: none;
      position: fixed;
      top: 6px;
      right: 8px;
      z-index: 1;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 4px;
      max-width: calc(100% - 80px);
      font: 12px system-ui, sans-serif;
    }
    .pronos-replay-controls button, #replay-clock-status:not(:empty) {
      padding: 4px 8px;
      color: #f5f5f3;
      background: #202020;
      border: 1px solid #484848;
      border-radius: 4px;
      font: inherit;
    }
    .pronos-replay-controls button { cursor: pointer; }
    body:has(#replayControlBarModal.show) .pronos-replay-controls { display: flex; }
    body[data-hide-replay-controls] #replayControlBarModal { visibility: hidden !important; }
  </style>
</head>
<body>
  <vunelix-advanced-chart
    data-symbol="NASDAQ:NDX"
    data-period="1"
    data-chart-type="area"
    data-theme="dark"
    data-timezone="-360"
    data-full-page="true"
    data-show-toolbar="true"
    data-show-replay="true"
    data-show-search="false"
    data-show-sidebar="false"
    data-show-range="false"
    data-show-indicators="false"
    data-show-symbol-info="false"
    data-show-settings="false"
    data-show-multi-chart="false"
    data-show-templates="false"
    data-show-capture="false"
    data-show-undo-redo="false"
    data-show-chart-types="false"
    data-show-timeframes="false"
    data-show-context-menu="false"
    data-show-high-low="false"
    data-show-ask-bid="false"
    data-enable-cache="false"
    data-change-url="false"
  ></vunelix-advanced-chart>
  <div class="pronos-replay-controls">
    <span id="replay-clock-status" role="status"></span>
    <button id="replay-clock" type="button" hidden>Replay 1:1</button>
    <button id="replay-controls-toggle" type="button" aria-controls="replayControlBarModal" aria-expanded="true">
      Ocultar controles
    </button>
  </div>
  <script>
    if (window.top !== window.self && location.hostname === 'pronos-chi.vercel.app') {
      const chart = document.querySelector('vunelix-advanced-chart');
      const params = new URLSearchParams(location.search);
      const asset = params.get('asset');
      if (asset === 'usdmxn') {
        chart.dataset.symbol = 'FX:USDMXN';
        chart.dataset.showReplay = 'false';
      } else if (asset === 'spx') {
        chart.dataset.symbol = 'SP:SPX';
      }
      const script = document.createElement('script');
      const allowedParents = ['https://pronos.io', 'https://www.pronos.io'];
      const replayToggle = document.getElementById('replay-controls-toggle');

      replayToggle.addEventListener('click', () => {
        const hidden = document.body.toggleAttribute('data-hide-replay-controls');
        replayToggle.setAttribute('aria-expanded', String(!hidden));
        replayToggle.textContent = hidden ? 'Mostrar controles' : 'Ocultar controles';
      });

      const minute = 60_000;
      const showStart = Date.parse(params.get('showStart'));
      const showEnd = Date.parse(params.get('showEnd'));
      const recordingStart = Date.parse(params.get('recordingStart'));
      const recordingEnd = Date.parse(params.get('recordingEnd'));
      if (asset === 'ndx' && showEnd - showStart === 30 * minute && recordingEnd - recordingStart === showEnd - showStart) {
        const clockButton = document.getElementById('replay-clock');
        const status = document.getElementById('replay-clock-status');
        const barLabel = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/Mexico_City', month: 'short', day: 'numeric', year: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: true,
        });
        const showTime = new Intl.DateTimeFormat('es-MX', {
          timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
        });
        let timer;
        clockButton.hidden = false;

        // Read the visible replay timestamp and use the widget's single-bar control.
        function pausedAt(step) {
          const modal = document.querySelector('#replayControlBarModal.show');
          const actual = modal?.querySelector('.replay-time-display')?.textContent.trim().replace(/\s+/g, ' ');
          const expected = barLabel.format(recordingStart + step * minute).replace(/\s+/g, ' ');
          return actual === expected && modal.querySelector('.replay-play-pause polygon') ? modal : null;
        }

        function stop(message = '') {
          clearTimeout(timer);
          timer = undefined;
          clockButton.textContent = 'Replay 1:1';
          status.textContent = message;
        }

        function scheduleNext(step) {
          const deadline = showStart + (step + 1) * minute;
          timer = setTimeout(() => {
            const forward = pausedAt(step)?.querySelector('[data-tooltip-title^="Step Forward"]');
            if (!forward || forward.disabled || Date.now() >= deadline + minute) {
              stop('Replay 1:1 interrumpido. Vuelve a seleccionar la barra indicada.');
              return;
            }
            forward.click();
            timer = setTimeout(() => {
              const next = step + 1;
              if (!pausedAt(next)) {
                stop('Vunelix no avanzó a la barra esperada.');
              } else if (recordingStart + next * minute === recordingEnd) {
                stop('Replay finalizado');
              } else {
                status.textContent = '';
                scheduleNext(next);
              }
            }, 250);
          }, Math.max(0, deadline - Date.now()));
        }

        clockButton.addEventListener('click', () => {
          if (timer !== undefined) {
            stop();
            return;
          }
          const now = Date.now();
          if (now >= showEnd) {
            status.textContent = 'El horario del replay ya terminó.';
            return;
          }
          const step = Math.max(0, Math.floor((now - showStart) / minute));
          if (!pausedAt(step)) {
            const bar = showTime.format(recordingStart + step * minute);
            status.textContent = `Selecciona la barra del 13 nov a las ${bar} CDMX y déjala pausada.`;
            return;
          }
          clockButton.textContent = 'Detener 1:1';
          status.textContent = now < showStart ? `Preparado · ${showTime.format(showStart)} CDMX` : '';
          scheduleNext(step);
        });
      }

      function notifyWhenReady(event) {
        if (event.source !== window.parent || !allowedParents.includes(event.origin)
          || event.data !== 'pronos:festival-chart-init') return;
        window.removeEventListener('message', notifyWhenReady);
        const deadline = Date.now() + 30000;
        const check = () => {
          if (chart.shadowRoot?.querySelector('canvas')) {
            window.parent.postMessage('pronos:festival-chart-ready', event.origin);
          } else if (Date.now() < deadline) {
            setTimeout(check, 250);
          }
        };
        check();
      }

      script.type = 'module';
      script.src = 'https://vunelix.com/assets/bundles/js/widgets/charts/vunelix-advanced-chart.js';
      window.addEventListener('message', notifyWhenReady);
      document.body.append(script);
    }
  </script>
</body>
</html>
